<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners for iOS -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded rectangle background -->
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  
  <!-- Large medical cross -->
  <rect x="67.5" y="30" width="45" height="120" fill="white" rx="12"/>
  <rect x="30" y="67.5" width="120" height="45" fill="white" rx="12"/>
  
  <!-- Emergency indicator -->
  <circle cx="140" cy="40" r="20" fill="#EF4444"/>
  <circle cx="140" cy="40" r="12" fill="white"/>
  
  <!-- SkyMed text (simplified) -->
  <text x="90" y="165" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">SkyMed</text>
</svg>